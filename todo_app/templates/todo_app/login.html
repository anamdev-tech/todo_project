{% extends 'todo_app/base.html' %}
{% block content %}
<h3 class="mb-3 text-center">Login</h3>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 text-center">অ্যাকাউন্ট নেই? <a href="{% url 'register' %}">Register করুন</a></p>
{% endblock %}
