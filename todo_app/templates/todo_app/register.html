{% extends 'todo_app/base.html' %}
{% block content %}
<h3 class="mb-3 text-center">Register</h3>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100">Sign Up</button>
</form>
<p class="mt-3 text-center">আগে থেকেই অ্যাকাউন্ট আছে? <a href="{% url 'login' %}">Login করুন</a></p>
{% endblock %}
